name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: sh -n castspin/run.sh
      - run: cmp LICENSE castspin/LICENSE

  container:
    name: Container (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build Home Assistant App on native architecture
        run: docker build --tag castspin:test castspin
      - name: Smoke-test the actual image (not a Supervisor install)
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name castspin-test --publish 127.0.0.1:8099:8099 castspin:test
          trap 'docker logs castspin-test; docker rm --force castspin-test' EXIT
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 --connect-timeout 2 --max-time 3 http://127.0.0.1:8099/healthz > /tmp/health.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/health.json').read_text())
          assert value == {'status': 'ok', 'cast_receiver': 'not_implemented', 'sendspin': 'not_implemented'}, value
          PY
          docker exec castspin-test test -s /usr/share/licenses/castspin/LICENSE
