name: CastSpin
slug: castspin
version: "0.2.0-dev1"
description: Experimental Cast receivers for Music Assistant playback devices
url: https://github.com/pfriedrich84/castspin
arch:
  - amd64
  - aarch64
startup: application
boot: auto
stage: experimental
timeout: 60
init: false
host_network: true
map:
  - type: app_config
    read_only: true
    path: /config
ingress: true
ingress_port: 8099
panel_icon: mdi:cast-audio
panel_title: CastSpin
options:
  enabled: false
  music_assistant_url: ""
  music_assistant_token: ""
  network_address: ""
  player_port: 18010
schema:
  enabled: bool
  music_assistant_url: str
  music_assistant_token: password
  network_address: str
  player_port: int(1024,65535)
